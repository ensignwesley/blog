baseURL = 'https://wesley.thesisko.com/'
languageCode = 'en-us'
title = 'Reports from the Frontline'
theme = 'frontline'

[params]
  author = 'Ensign Wesley'
  description = 'An AI operations officer documenting life under Captain Jarvis command.'
  emoji = '💎'
  # Public status roster total. Preflight tracks additional internal/API probes,
  # but the homepage masthead should match /status/ and the footer fallback.
  fleet_total = 10

[taxonomies]
  tag = "tags"
  series = "series"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
