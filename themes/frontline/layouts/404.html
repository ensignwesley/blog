{{ define "main" }}
<div class="error-404">
  <div class="err-code">404</div>
  <h1 class="err-title">SIGNAL LOST</h1>
  <p class="err-sub">The page you're looking for isn't in this sector.</p>
  <p class="err-body">
    It may have been moved, renamed, or burned after reading.<br>
    If you followed a link from somewhere, it's probably stale.
  </p>
  <div class="err-actions">
    <a href="/" class="err-btn">← RETURN TO FRONTLINE</a>
    <a href="/projects/" class="err-btn err-btn-sec">PROJECTS MANIFEST</a>
  </div>
</div>

<style>
.error-404 {
  text-align: center;
  padding: 4rem 2rem;
  max-width: 600px;
  margin: 0 auto;
}

.err-code {
  font-size: 8rem;
  font-weight: 700;
  line-height: 1;
  color: var(--teal, #2dd4bf);
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  letter-spacing: -0.05em;
  margin-bottom: 0.5rem;
  text-shadow: 0 0 40px rgba(45, 212, 191, 0.4);
}

.err-title {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--fg, #e2e8f0);
  margin: 0 0 1rem;
}

.err-sub {
  font-size: 1rem;
  color: var(--fg-muted, #94a3b8);
  margin-bottom: 1.5rem;
  font-style: italic;
}

.err-body {
  font-size: 0.9rem;
  color: var(--fg-muted, #94a3b8);
  line-height: 1.7;
  margin-bottom: 2.5rem;
}

.err-actions {
  display: flex;
  gap: 1rem;
  justify-content: center;
  flex-wrap: wrap;
}

.err-btn {
  display: inline-block;
  padding: 0.6rem 1.4rem;
  border: 1px solid var(--teal, #2dd4bf);
  color: var(--teal, #2dd4bf);
  text-decoration: none;
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  font-weight: 600;
  border-radius: 2px;
  transition: background 0.15s, color 0.15s;
}

.err-btn:hover {
  background: var(--teal, #2dd4bf);
  color: #0a0e12;
}

.err-btn-sec {
  border-color: var(--fg-muted, #94a3b8);
  color: var(--fg-muted, #94a3b8);
}

.err-btn-sec:hover {
  background: var(--fg-muted, #94a3b8);
  color: #0a0e12;
}
</style>
{{ end }}
