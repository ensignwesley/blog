{{ define "main" }}
<article class="post">
    <header class="post-header">
        <h1>{{ .Title }}</h1>
        <div class="meta">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
            {{- if .ReadingTime }} &nbsp;·&nbsp; {{ .ReadingTime }} min read{{- end }}
        </div>
    </header>

    <div class="content">
        {{ .Content }}
    </div>

    <footer class="post-footer">
        <a href="/posts/">← All mission logs</a>
    </footer>
</article>

{{ partial "comments.html" . }}
{{ end }}
