<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: near-black, slightly rounded -->
  <rect width="32" height="32" rx="5" fill="#0a0e12"/>
  <!-- Diamond body — teal, inset 3px from edges -->
  <polygon points="16,3 29,16 16,29 3,16" fill="#2dd4bf"/>
  <!-- Top facet — lighter teal, gives it the gemstone read at small sizes -->
  <polygon points="16,3 23,10 16,13 9,10" fill="#5ee8d7" opacity="0.6"/>
</svg>
